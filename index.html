<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#18201d">
    <title>AI Shakedown Console</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=9">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css?v=1.11.3">
    <link rel="stylesheet" href="style.css?v=workspace-5">
</head>
<body>
    <header class="app-header">
        <div class="brand-block">
            <div class="brand-mark" aria-hidden="true">AI</div>
            <div>
                <h1>AI Shakedown Console</h1>
                <p>多协议 API 调试台</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="connection-state" id="connection-state" data-state="idle">
                <span class="status-dot"></span>
                <span id="connection-state-text">尚未检查</span>
                <span id="latency-text"></span>
            </div>
            <button class="icon-button mobile-only" id="settings-toggle" type="button" title="连接设置" aria-label="打开连接设置">
                <i class="bi bi-sliders"></i>
            </button>
        </div>
    </header>

    <main class="workspace">
        <aside class="settings-panel" id="settings-panel" aria-label="连接和模型设置">
            <div class="panel-heading">
                <div>
                    <span class="eyebrow">CONNECTION</span>
                    <h2>连接配置</h2>
                </div>
                <button class="icon-button mobile-only" id="settings-close" type="button" title="关闭设置" aria-label="关闭连接设置">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <section class="saved-library" aria-label="已保存的连接配置">
                <div class="library-title-row">
                    <span>配置库</span>
                    <button class="text-button" id="profile-new" type="button">新建</button>
                </div>
                <select id="profile-select" aria-label="选择已保存配置">
                    <option value="">未选择配置</option>
                </select>
                <input id="profile-name" type="text" maxlength="40" autocomplete="off" placeholder="输入配置名称">
                <div class="library-actions">
                    <button class="secondary-button compact" id="profile-save" type="button">
                        <i class="bi bi-floppy"></i><span>保存</span>
                    </button>
                    <button class="secondary-button compact" id="profile-load" type="button">
                        <i class="bi bi-box-arrow-in-down"></i><span>加载</span>
                    </button>
                    <button class="icon-button" id="profile-delete" type="button" title="删除配置" aria-label="删除配置" disabled>
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
            </section>

            <div class="form-stack">
                <label class="field">
                    <span>服务商预设</span>
                    <select id="provider-select"></select>
                </label>

                <label class="field">
                    <span>协议</span>
                    <select id="protocol-select">
                        <option value="openai">OpenAI Compatible</option>
                        <option value="anthropic">Anthropic Messages</option>
                        <option value="gemini">Google Gemini</option>
                    </select>
                </label>

                <label class="field">
                    <span>Base URL</span>
                    <input id="base-url" type="url" spellcheck="false" autocomplete="off">
                </label>

                <label class="field">
                    <span>请求路径</span>
                    <input id="chat-path" type="text" spellcheck="false" autocomplete="off">
                </label>

                <label class="field">
                    <span>API Key</span>
                    <div class="input-with-action">
                        <input id="api-key" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off">
                        <button class="field-icon-button" id="key-visibility" type="button" title="显示或隐藏 API Key" aria-label="显示 API Key">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <small class="field-hint">保存在当前浏览器的站点数据中，点击“清除全部本地数据”或清除站点数据后移除。</small>
                </label>

                <label class="field">
                    <span>认证方式</span>
                    <select id="auth-mode">
                        <option value="bearer">Authorization: Bearer</option>
                        <option value="x-api-key">x-api-key</option>
                        <option value="api-key">api-key</option>
                        <option value="query">Query: key</option>
                        <option value="none">无认证</option>
                    </select>
                </label>

                <label class="toggle-row" title="通过当前网站的 Worker 或本地代理转发请求，解决浏览器跨域限制">
                    <span>使用同域代理</span>
                    <input id="proxy-toggle" type="checkbox">
                    <span class="toggle-control" aria-hidden="true"></span>
                </label>

                <div class="field">
                    <label for="model-select">模型</label>
                    <div class="input-with-button">
                        <select id="model-select" aria-label="模型列表"></select>
                        <button class="secondary-button compact" id="load-models" type="button" title="从服务端读取模型">
                            <i class="bi bi-arrow-repeat"></i>
                            <span>读取</span>
                        </button>
                    </div>
                    <input id="model-input" type="text" spellcheck="false" autocomplete="off" placeholder="输入自定义模型名称" hidden>
                    <label class="field reasoning-field" for="reasoning-effort">
                        <span>思考强度</span>
                        <select id="reasoning-effort" title="仅 OpenAI Compatible 协议会发送 reasoning_effort">
                            <option value="">自动</option>
                            <option value="none">无</option>
                            <option value="minimal">最低</option>
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                            <option value="xhigh">很高</option>
                            <option value="max">最高</option>
                        </select>
                    </label>
                </div>

                <details class="advanced-settings">
                    <summary>高级连接设置</summary>
                    <div class="details-content">
                        <label class="field">
                            <span>模型列表路径</span>
                            <input id="models-path" type="text" spellcheck="false">
                        </label>
                        <label class="field">
                            <span>自定义请求头（JSON）</span>
                            <textarea id="custom-headers" rows="3" spellcheck="false" placeholder='{"X-Project": "demo"}'></textarea>
                        </label>
                        <label class="field">
                            <span>附加请求参数（JSON）</span>
                            <textarea id="extra-body" rows="3" spellcheck="false" placeholder='{"response_format": {"type": "json_object"}}'></textarea>
                        </label>
                        <button class="secondary-button full-width" id="clear-saved-settings" type="button">
                            <i class="bi bi-trash3"></i>
                            <span>清除全部本地数据</span>
                        </button>
                    </div>
                </details>

                <div class="endpoint-preview" title="最终请求地址">
                    <i class="bi bi-link-45deg"></i>
                    <code id="endpoint-preview"></code>
                </div>

                <button class="primary-button full-width" id="test-connection" type="button">
                    <i class="bi bi-plug"></i>
                    <span>检查连接</span>
                </button>
            </div>

            <div class="panel-divider"></div>

            <div class="panel-heading compact-heading">
                <div>
                    <span class="eyebrow">GENERATION</span>
                    <h2>生成参数</h2>
                </div>
            </div>

            <div class="form-stack parameter-grid">
                <label class="field">
                    <span>Temperature</span>
                    <input id="temperature" type="number" min="0" max="2" step="0.05" value="0.7">
                </label>
                <label class="field">
                    <span>Top P</span>
                    <input id="top-p" type="number" min="0" max="1" step="0.05" value="1">
                </label>
                <label class="field">
                    <span>Top K</span>
                    <input id="top-k" type="number" min="1" step="1" placeholder="不发送">
                </label>
                <label class="field">
                    <span>Max Tokens</span>
                    <input id="max-tokens" type="number" min="1" step="1" value="1024">
                </label>
                <label class="toggle-row span-two">
                    <span>流式响应</span>
                    <input id="stream-toggle" type="checkbox" checked>
                    <span class="toggle-control" aria-hidden="true"></span>
                </label>
            </div>

            <div class="panel-divider"></div>

            <div class="stats-header">
                <span class="eyebrow">SESSION USAGE</span>
                <button class="icon-button small" id="reset-stats" type="button" title="清空用量" aria-label="清空用量">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
            </div>
            <div class="stats-grid">
                <div><span>输入</span><strong id="total-input-tokens">0</strong></div>
                <div><span>输出</span><strong id="total-output-tokens">0</strong></div>
                <div><span>请求</span><strong id="total-requests">0</strong></div>
                <div><span>费用</span><strong id="total-cost">¥ 0.0000</strong></div>
            </div>
            <div class="cost-fields">
                <label class="field"><span>输入价 / 百万 Token</span><input id="input-price" type="number" min="0" step="0.01" value="0"></label>
                <label class="field"><span>输出价 / 百万 Token</span><input id="output-price" type="number" min="0" step="0.01" value="0"></label>
                <label class="field span-two"><span>费用上限</span><input id="cost-limit" type="number" min="0" step="0.01" placeholder="0 表示不限"></label>
            </div>
        </aside>

        <section class="chat-panel" aria-label="模型对话">
            <div class="chat-toolbar">
                <div>
                    <span class="eyebrow">PLAYGROUND</span>
                    <h2 id="active-model-title">新会话</h2>
                </div>
                <div class="toolbar-actions">
                    <button class="icon-button" id="stop-request" type="button" title="停止生成" aria-label="停止生成" disabled>
                        <i class="bi bi-stop-fill"></i>
                    </button>
                    <button class="icon-button" id="clear-chat" type="button" title="清空对话" aria-label="清空对话">
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
            </div>

            <div class="conversation-bar">
                <div class="conversation-tabs" id="conversation-tabs" role="tablist" aria-label="对话窗口"></div>
                <button class="secondary-button compact conversation-new" id="new-conversation" type="button" title="新建对话">
                    <i class="bi bi-plus-lg"></i><span>新对话</span>
                </button>
            </div>

            <div class="chat-window" id="chat-window" aria-live="polite">
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon"><i class="bi bi-terminal"></i></div>
                    <strong>控制台已就绪</strong>
                    <span id="empty-endpoint">选择服务商与模型后开始对话</span>
                </div>
            </div>

            <form class="composer" id="message-form">
                <div class="prompt-library" aria-label="提示词库">
                    <select id="prompt-select" aria-label="选择已保存提示词">
                        <option value="">提示词库</option>
                    </select>
                    <input id="prompt-name" type="text" maxlength="40" autocomplete="off" placeholder="提示词名称">
                    <button class="icon-button small" id="prompt-save" type="button" title="保存提示词" aria-label="保存提示词">
                        <i class="bi bi-floppy"></i>
                    </button>
                    <button class="icon-button small" id="prompt-load" type="button" title="加载提示词" aria-label="加载提示词" disabled>
                        <i class="bi bi-box-arrow-in-down"></i>
                    </button>
                    <button class="icon-button small" id="prompt-delete" type="button" title="删除提示词" aria-label="删除提示词" disabled>
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
                <label class="system-field" for="system-prompt">System</label>
                <textarea id="system-prompt" rows="2" placeholder="You are a helpful assistant."></textarea>
                <div class="message-compose-row">
                    <textarea id="message-input" rows="2" placeholder="输入消息" autocomplete="off"></textarea>
                    <button class="send-button" id="send-button" type="submit" title="发送消息">
                        <i class="bi bi-arrow-up"></i>
                        <span>发送</span>
                    </button>
                </div>
            </form>
        </section>

        <aside class="inspector-panel" aria-label="请求检查器">
            <div class="inspector-heading">
                <div>
                    <span class="eyebrow">INSPECTOR</span>
                    <h2>请求检查器</h2>
                </div>
                <button class="icon-button small" id="copy-inspector" type="button" title="复制当前内容" aria-label="复制当前检查器内容">
                    <i class="bi bi-copy"></i>
                </button>
            </div>
            <div class="segmented-control" role="tablist" aria-label="检查器内容">
                <button type="button" class="active" data-inspector-tab="request" role="tab" aria-selected="true">请求</button>
                <button type="button" data-inspector-tab="response" role="tab" aria-selected="false">响应</button>
                <button type="button" data-inspector-tab="events" role="tab" aria-selected="false">事件</button>
            </div>
            <pre class="inspector-content" id="inspector-content">尚无请求</pre>
            <div class="inspector-meta">
                <div><span>HTTP</span><strong id="http-status">-</strong></div>
                <div><span>耗时</span><strong id="request-duration">-</strong></div>
                <div><span>协议</span><strong id="request-protocol">-</strong></div>
            </div>
        </aside>
    </main>

    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="toast-region" id="toast-region" aria-live="assertive"></div>
    <div class="build-version" title="当前部署版本">v9</div>
    <script src="vendor/marked.min.js?v=15.0.12"></script>
    <script src="vendor/purify.min.js?v=3.2.6"></script>
    <script type="module" src="script.js?v=workspace-5"></script>
</body>
</html>
