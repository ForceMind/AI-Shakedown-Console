plugins {
    id 'com.android.application'
}

def localDebugKeystore = rootProject.file('../.android-signing/debug.keystore')

if (!localDebugKeystore.exists()) {
    throw new GradleException(
        'Missing .android-signing/debug.keystore. Restore the preserved signing key before building; ' +
        'generating a replacement will prevent upgrades over previously installed APKs.'
    )
}

android {
    namespace 'com.forcemind.aishakedownconsole'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.forcemind.aishakedownconsole'
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName 'v31'
    }

    signingConfigs {
        debug {
            storeFile localDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
