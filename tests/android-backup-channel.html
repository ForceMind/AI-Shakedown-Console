<!doctype html><meta charset="utf-8"><title>APK 备份通道浏览器回归</title>
<style>body{margin:0;font:14px system-ui}header{padding:10px;background:#eee}button{padding:8px}iframe{border:0;width:100%;height:80vh}#result{white-space:pre-wrap}</style>
<header><button id="export-backup">验证当前 Origin 的完整备份通道</button><p>测试专用：模拟原生建立的短期消息端口，读取当前测试 Origin 的完整聊天备份。不会清除源数据，不含连接凭据。仅在 127.0.0.1 测试服务使用。</p><p id="result" role="status">尚未运行；此页不验证 Android 系统文件选择器。</p></header>
<iframe id="app" src="/?no-sw=1"></iframe>
<script type="module">
const app=document.querySelector('#app');
document.querySelector('#export-backup').onclick=()=>{
    if(location.hostname!=='127.0.0.1')throw Error('仅允许本地测试');
    const channel=new MessageChannel(),parts=[];let expected=0;
    channel.port1.onmessage=async({data})=>{
        const m=JSON.parse(data);
        if(m.type==='start'){expected=m.size;channel.port1.postMessage('next');}
        if(m.type==='chunk'){parts.push(Uint8Array.from(atob(m.data),x=>x.charCodeAt(0)));channel.port1.postMessage('next');}
        if(m.type==='end'){
            const blob=new Blob(parts,{type:'application/json'}),text=await blob.text(),backup=JSON.parse(text);
            if(blob.size!==expected)throw Error('字节数不匹配');
            const response=await fetch('http://127.0.0.1:43512/test/save-backup',{method:'POST',body:text});
            if(!response.ok)throw Error('测试收集端未启动');
            channel.port1.postMessage('saved');channel.port1.close();
            document.querySelector('#result').textContent='PASS：'+backup.conversations.length+' 对话，'+backup.conversations.reduce((n,c)=>n+c.history.length,0)+' 消息，'+backup.attachments.length+' 附件，'+blob.size+' 字节。UTF-8 完整备份已写到本机测试收集端，源数据未改动。';
        }
        if(m.type==='error')document.querySelector('#result').textContent='FAIL：'+m.message;
    };
    app.contentWindow.dispatchEvent(new MessageEvent('message',{data:'AI_SHAKEDOWN_EXPORT_BACKUP_V1',ports:[channel.port2],source:null}));
};
</script>
